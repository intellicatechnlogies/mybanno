{% extends 'base.html' %}
{% block title %}Admin login · Mybanno{% endblock %}
{% block content %}<div class="container login-page"><section class="login-card"><h1>Welcome back</h1><p>Sign in to manage the Mybanno collection.</p><form method="post">{% csrf_token %}<label for="username">Username</label><input id="username" name="username" required autocomplete="username"><label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password"><button class="button" type="submit">Sign in</button></form></section></div>{% endblock %}
