{% for product in products %}
  <article class="product-card">
    <button class="product-card-link" type="button" data-modal-url="{% url 'product_modal_data' product_id=product.id %}" aria-label="View {{ product.name }}">
      <div class="product-visual">{% if product.offer_price != None %}<span class="sale-badge product-sale">{{ product.discount_percentage }}% OFF</span>{% elif product.on_offer %}<span class="sale-badge product-sale">Sale</span>{% endif %}{% with media=product.gallery_items|first %}{% if media.media_type == 'video' %}<video class="product-image" src="{{ media.data_url }}" muted preload="metadata" aria-label="{{ product.name }} video"></video>{% elif media.data_url %}<img class="product-image" src="{{ media.data_url }}" alt="{{ product.name }}">{% else %}<div class="product-image placeholder" aria-label="No product image">T&amp;C</div>{% endif %}{% endwith %}</div>
      <div class="product-info"><span class="eyebrow">{{ product.category }} · {{ product.cloth_type }}{% if product.occasion_category %} · {{ product.occasion_category }}{% endif %}</span><h3>{{ product.name }}</h3><p class="product-description">{% if product.description %}{{ product.description }}{% else %}A carefully selected piece for your everyday wardrobe.{% endif %}</p>{% if product.description|length > 80 %}<span class="product-see-more">See more</span>{% endif %}<div class="product-meta"><span class="price-display">{% if product.offer_price != None %}<del>{{ product.actual_price|default:product.price|floatformat:2 }}</del><strong>{{ product.offer_price|floatformat:2 }}</strong>{% else %}{{ product.actual_price|default:product.price|floatformat:2 }}{% endif %}</span><span class="stock">{% if product.available_stock > 0 %}{{ product.available_stock }} in stock{% else %}Sold out{% endif %}</span></div>{% if product.colors %}<div class="product-color-swatches" aria-label="Available colors">{% for color in product.color_options %}<span class="product-color-swatch" style="--swatch:{{ color.value }}" title="{{ color.name }}" aria-label="Available color: {{ color.name }}"></span>{% endfor %}</div>{% endif %}{% if product.sizes %}<div class="size-pills">{% for inventory in product.available_size_inventory %}<span>{{ inventory.size }} · {{ inventory.stock }}</span>{% endfor %}</div>{% endif %}</div>
    </button>
    <button class="product-card-add" type="button" data-modal-url="{% url 'product_modal_data' product_id=product.id %}" aria-label="Add {{ product.name }} to cart" {% if product.available_stock < 1 %}disabled{% endif %}>{% if product.available_stock > 0 %}Add to cart{% else %}Sold out{% endif %}</button>
  </article>
{% endfor %}
