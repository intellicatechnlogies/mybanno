deploy:
  runs-on: ubuntu-latest
  if: github.event_name == 'push'
  needs: build

  environment:
    name: production
    #url: https://visitgayaji.com

  steps:
    - uses: actions/checkout@v3

    - name: Deploy to GCP VM
      uses: appleboy/ssh-action@v0.1.10

      with:
        host: ${{ secrets.GCP_VM_IP }}
        username: ${{ secrets.GCP_VM_USER }}
        key: ${{ secrets.GCP_SSH_KEY }}

        script: |

          PROJECT_DIR=/home/raumi/Mybanno
          VENV_DIR=$PROJECT_DIR/venv
          REPO_URL=https://github.com/intellicatechnlogies/mybanno.git

          echo "===== INSTALL PACKAGES ====="

          sudo apt-get update -y

          sudo apt-get install -y \
          python3-pip \
          python3-venv \
          python3-dev \
          build-essential \
          git \
          nginx \
          certbot \
          python3-certbot-nginx

          echo "===== CREATE PROJECT DIRECTORY ====="

          mkdir -p $PROJECT_DIR

          echo "===== CLONE OR UPDATE REPO ====="

          if [ ! -d "$PROJECT_DIR/.git" ]; then

            rm -rf $PROJECT_DIR/*

            git clone $REPO_URL $PROJECT_DIR

          else

            cd $PROJECT_DIR

            git add .

            git commit -m "Server backup before deployment" || true

            git fetch origin main

            git reset --hard origin/main

          fi

          cd $PROJECT_DIR

          echo "===== CREATE FOLDERS ====="

          mkdir -p static
          mkdir -p staticfiles
          mkdir -p media
          mkdir -p logs

          echo "===== CREATE VENV ====="

          if [ ! -d "$VENV_DIR" ]; then
              python3 -m venv $VENV_DIR
          fi

          source $VENV_DIR/bin/activate

          echo "===== INSTALL REQUIREMENTS ====="

          pip install --upgrade pip

          pip install -r requirements.txt

          pip install gunicorn

          echo "===== ENV FILE ====="

          if [ ! -f ".env" ]; then
             touch .env
          fi

          echo "===== DJANGO MIGRATIONS ====="

          python manage.py migrate --noinput

          python manage.py collectstatic --noinput

          echo "===== FIX PERMISSIONS ====="

          sudo chmod 755 /home
          sudo chmod 755 /home/raumi
          sudo chmod 755 $PROJECT_DIR

          sudo chown -R raumi:www-data $PROJECT_DIR

          sudo chmod -R 755 $PROJECT_DIR

          echo "===== GUNICORN SOCKET ====="

          sudo mkdir -p /run/gunicorn

          sudo chown raumi:www-data /run/gunicorn

          echo "===== CREATE GUNICORN SERVICE ====="

          sudo tee /etc/systemd/system/gunicorn.service > /dev/null << EOF
          [Unit]
          Description=Gunicorn Service
          After=network.target

          [Service]
          User=raumi
          Group=www-data
          WorkingDirectory=$PROJECT_DIR

          ExecStart=$VENV_DIR/bin/gunicorn \
          --workers 3 \
          --bind unix:/run/gunicorn/gunicorn.sock \
          cloths_project.wsgi:application

          Restart=always

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo systemctl daemon-reload

          sudo systemctl enable gunicorn

          sudo systemctl restart gunicorn

          echo "===== NGINX CONFIG ====="

          sudo tee /etc/nginx/sites-available/cloths > /dev/null << EOF

          server {

              listen 80;

              server_name visitgayaji.com www.visitgayaji.com;

              location /static/ {
                  alias $PROJECT_DIR/staticfiles/;
              }

              location /media/ {
                  alias $PROJECT_DIR/media/;
              }

              location / {

                  include proxy_params;

                  proxy_pass http://unix:/run/gunicorn/gunicorn.sock;
              }
          }

          EOF

          sudo ln -sf \
          /etc/nginx/sites-available/cloths \
          /etc/nginx/sites-enabled/

          sudo rm -f /etc/nginx/sites-enabled/default

          sudo nginx -t

          sudo systemctl restart nginx

          echo "===== SSL ====="

          # sudo certbot --nginx \
          # -d visitgayaji.com \
          # -d www.visitgayaji.com \
          # --non-interactive \
          # --agree-tos \
          # -m sales@intellicatechnology.com || true

          echo "===== RESTART SERVICES ====="

          sudo systemctl restart gunicorn

          sudo systemctl restart nginx

          echo "===== LOGS ====="

          sudo journalctl -u gunicorn -n 50 --no-pager

          sudo tail -n 50 /var/log/nginx/error.log