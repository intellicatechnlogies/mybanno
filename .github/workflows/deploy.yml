name: Django CI/CD Pipeline

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python manage.py test

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@v0.1.10

        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}

          script: |

            PROJECT_DIR=/home/raumi/Mybanno
            VENV_DIR=$PROJECT_DIR/venv
            REPO_URL=https://github.com/intellicatechnlogies/mybanno.git

            echo "===== UPDATE SERVER ====="

            sudo apt-get update -y

            sudo apt-get install -y \
              python3-pip \
              python3-venv \
              python3-dev \
              build-essential \
              git \
              nginx

            mkdir -p $PROJECT_DIR

            if [ ! -d "$PROJECT_DIR/.git" ]; then

              git clone $REPO_URL $PROJECT_DIR

            else

              cd $PROJECT_DIR

              git stash || true

              git fetch origin main

              git reset --hard origin/main

            fi

            cd $PROJECT_DIR

            mkdir -p static
            mkdir -p staticfiles
            mkdir -p media
            mkdir -p logs

            if [ ! -d "$VENV_DIR" ]; then
              python3 -m venv $VENV_DIR
            fi

            source $VENV_DIR/bin/activate

            pip install --upgrade pip

            pip install -r requirements.txt

            pip install gunicorn

            if [ ! -f ".env" ]; then
              touch .env
            fi

            python manage.py migrate --noinput

            python manage.py collectstatic --noinput

            sudo chown -R raumi:www-data $PROJECT_DIR

            sudo chmod -R 755 $PROJECT_DIR

            sudo mkdir -p /run/gunicorn

            sudo chown raumi:www-data /run/gunicorn

            sudo tee /etc/systemd/system/gunicorn.service > /dev/null << EOF
            [Unit]
            Description=Gunicorn Service
            After=network.target

            [Service]
            User=raumi
            Group=www-data
            WorkingDirectory=$PROJECT_DIR

            ExecStart=$VENV_DIR/bin/gunicorn \
            --workers 3 \
            --bind unix:/run/gunicorn/gunicorn.sock \
            cloths_project.wsgi:application

            Restart=always

            [Install]
            WantedBy=multi-user.target
            EOF

            sudo systemctl daemon-reload

            sudo systemctl enable gunicorn

            sudo systemctl restart gunicorn

            sudo tee /etc/nginx/sites-available/mybanno > /dev/null << EOF
            server {

                listen 80;

                location /static/ {
                    alias $PROJECT_DIR/staticfiles/;
                }

                location /media/ {
                    alias $PROJECT_DIR/media/;
                }

                location / {

                    include proxy_params;

                    proxy_pass http://unix:/run/gunicorn/gunicorn.sock;
                }
            }
            EOF

            sudo ln -sf \
            /etc/nginx/sites-available/mybanno \
            /etc/nginx/sites-enabled/mybanno

            sudo rm -f /etc/nginx/sites-enabled/default

            sudo nginx -t

            sudo systemctl restart nginx

            sudo systemctl restart gunicorn

            echo "===== GUNICORN STATUS ====="

            sudo systemctl status gunicorn --no-pager

            echo "===== RECENT LOGS ====="

            sudo journalctl -u gunicorn -n 50 --no-pager